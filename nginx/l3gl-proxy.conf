# ═══════════════════════════════════════════
# Nginx Reverse Proxy Configuration (VM2 - Sarr)
# Redirects /l3gl/* to VM1 (Kamara) Ingress
# ═══════════════════════════════════════════

server {
    listen 80;
    server_name localhost;

    location /l3gl/ {
        # IP Tailscale de Kamara (VM1) : 100.100.146.41
        proxy_pass http://100.100.146.41/;
        
        # Configuration des headers pour transmettre l'IP réelle de l'utilisateur
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout pour éviter les erreurs 504 sur les requêtes longues
        proxy_connect_timeout 90;
        proxy_send_timeout 90;
        proxy_read_timeout 90;
    }

    # Optionnel: Page de statut ou de test
    location /status {
        return 200 'Nginx Proxy (VM2 - Sarr) is Running';
        add_header Content-Type text/plain;
    }
}
