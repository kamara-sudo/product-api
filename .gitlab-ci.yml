# ═══════════════════════════════════════════
# GitLab CI/CD Pipeline - Groupe 2 (Product API)
# ═══════════════════════════════════════════

image: maven:3.9.6-eclipse-temurin-17

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""

cache:
  paths:
    - .m2/repository

stages:
  - test
  - build
  - docker
  - deploy

# 1. Job de Test
test:
  stage: test
  script:
    - cd product-core && mvn install -DskipTests # Build core library first
    - cd product-api && mvn test
  only:
    - develop

# 2. Job de Build (Génération du JAR)
build:
  stage: build
  script:
    - cd product-core && mvn install -DskipTests # Build core library first
    - cd product-api && mvn clean package -DskipTests
  artifacts:
    paths:
      - product-api/target/*.jar
    expire_in: 1 hour
  only:
    - develop

# 3. Job Docker (Build et Push sur Docker Hub)
docker:
  stage: docker
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  script:
    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
    - cd product-api && docker build -t $DOCKER_IMAGE:latest .
    - docker push $DOCKER_IMAGE:latest
  only:
    - develop

# 4. Job de Déploiement (Kubernetes)
deploy:
  stage: deploy
  image: bitnami/kubectl:latest
  script:
    - kubectl apply -f product-api/k8s/mysql.yaml
    - kubectl apply -f product-api/k8s/l3gl-devops.yaml
    - kubectl rollout restart deployment/product-api -n devops-l3gl
  only:
    - develop
